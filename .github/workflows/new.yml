name: Ultimate Video Downloader (Max Compression AV1)

on:
  workflow_dispatch:
    inputs:
      # ============================================================
      # ۱) ورودی‌های پایه
      # ============================================================
      video_url:
        description: '🔗 لینک ویدیو — آدرس کامل صفحه ویدیو (مثلاً https://example.com/video?id=123)'
        required: true
        type: string

      format_id:
        description: '🎯 شناسه کیفیت — خالی بذار تا لیست کیفیت‌ها بیاد. بعد مثلاً hls-2920 یا 1080p وارد کن.'
        required: false
        type: string

      compress:
        description: '🗜️ فشرده‌سازی — آیا بعد از دانلود فشرده بشه؟'
        required: true
        type: boolean
        default: true

      # ============================================================
      # ۲) تنظیمات فشرده‌سازی
      # ============================================================
      video_codec:
        description: '🎬 کدک — libx264 (سازگارترین)، libx265 (۲۵٪ کمتر)، libsvtav1 (کمترین حجم، فقط روی پلیرهای مدرن)'
        required: true
        type: choice
        default: 'libx264'
        options:
          - libx264
          - libx265
          - libsvtav1

      crf:
        description: '🎚️ کیفیت — کمتر = بهتر و حجیم‌تر | x264/x265: 0-51 (پیشنهاد 23) | AV1: 0-63 (پیشنهاد 30) | در حالت max-compression نادیده گرفته می‌شه'
        required: true
        type: number
        default: 23

      preset:
        description: '⚡ پریست x264/x265 — ultrafast سریع‌ترین، veryslow کندترین ولی بهترین فشرده‌سازی'
        required: false
        type: choice
        default: 'medium'
        options:
          - ultrafast
          - superfast
          - veryfast
          - faster
          - fast
          - medium
          - slow
          - slower
          - veryslow

      svtav1_preset:
        description: '⚡ پریست AV1 — 0 = کندترین و بهترین فشرده‌سازی، 13 = سریع‌ترین (در حالت max-compression نادیده گرفته می‌شه)'
        required: false
        type: number
        default: 8

      max_compression:
        description: '🔥 حداکثر فشرده‌سازی — فقط برای AV1: preset=0 و CRF=45 (کندترین ولی کمترین حجم). برای x264/x265 نادیده گرفته می‌شه.'
        required: true
        type: boolean
        default: false

      aggressive_compression:
        description: '⚡ حالت تهاجمی اضافی — CRF +۶، پریست کندتر، صدا 96k. با max_compression قابل ترکیبه.'
        required: true
        type: boolean
        default: false

      # ============================================================
      # ۳) تنظیمات صدا
      # ============================================================
      audio_codec:
        description: '🔊 کدک صدا — aac (سازگارترین)، libopus (حجم کمتر، خروجی MKV)'
        required: true
        type: choice
        default: 'aac'
        options:
          - aac
          - libopus

      audio_bitrate:
        description: '🎵 بیتریت صدا — 128k استاندارد، 96k سبک‌تر، 192k بهتر'
        required: false
        type: string
        default: '128k'

      # ============================================================
      # ۴) بسته‌بندی
      # ============================================================
      package_as_7z:
        description: '📦 بسته‌بندی با 7z — اثر کمی روی MP4 داره. فقط اگه چند فایل داری مفیده.'
        required: true
        type: boolean
        default: false

jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # ============================================================
      # بازیابی ابزارهای کش‌شده
      # ============================================================
      - name: Restore cached FFmpeg (with SVT-AV1)
        uses: actions/cache@v4
        with:
          path: ./ffmpeg-static
          key: ffmpeg-7.1-svtav1-3.0.2-prebuilt-true-${{ runner.os }}

      - name: Add FFmpeg to PATH
        shell: bash
        run: |
          if [ ! -f "${{ github.workspace }}/ffmpeg-static/bin/ffmpeg" ]; then
            echo "❌ FFmpeg cache not found! Run 'Setup Build Cache' workflow first."
            exit 1
          fi
          echo "${{ github.workspace }}/ffmpeg-static/bin" >> $GITHUB_PATH

      - name: Restore cached Python site-packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/lib/python3.12/site-packages
            ~/.local/bin
          key: pysite-2026.10.26-0.15.0-${{ runner.os }}

      - name: Add Python user bin to PATH
        shell: bash
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          if ! command -v yt-dlp &> /dev/null; then
            echo "❌ yt-dlp cache not found! Run 'Setup Build Cache' workflow first."
            exit 1
          fi

      - name: Restore cached aria2
        uses: actions/cache@v4
        with:
          path: /tmp/aria2-bin
          key: aria2-${{ runner.os }}-v1.37.0

      - name: Install aria2 if not cached
        shell: bash
        run: |
          if [ -f /tmp/aria2-bin/aria2c ]; then
            sudo cp /tmp/aria2-bin/aria2c /usr/local/bin/aria2c
            sudo chmod +x /usr/local/bin/aria2c
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq aria2
          fi

      # ============================================================
      # تأیید ابزارها و اعتبارسنجی
      # ============================================================
      - name: Verify tooling
        shell: bash
        run: |
          set -euo pipefail
          echo "--- FFmpeg ---"
          ffmpeg -version | head -n 1
          echo "--- Codecs ---"
          for codec in libx264 libx265 libsvtav1 libopus aac; do
            if ffmpeg -hide_banner -encoders 2>/dev/null | grep -q " $codec "; then
              echo "✅ $codec"
            else
              echo "❌ $codec NOT available"
            fi
          done
          echo "--- yt-dlp ---"
          yt-dlp --version
          echo "--- curl_cffi ---"
          python -c "import curl_cffi; print('curl_cffi:', curl_cffi.__version__)"

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ github.event.inputs.video_url }}"
          if [ -z "${URL// }" ]; then echo "❌ video_url خالی است"; exit 1; fi
          if ! [[ "$URL" =~ ^https?:// ]]; then echo "❌ video_url باید با http(s):// شروع شود"; exit 1; fi
          if [ "${{ github.event.inputs.aggressive_compression }}" = "true" ] && \
             [ "${{ github.event.inputs.compress }}" != "true" ]; then
            echo "⚠️ aggressive_compression=true ولی compress=false → نادیده گرفته می‌شود."
          fi

      # ============================================================
      # لیست فرمت‌ها
      # ============================================================
      - name: List Formats
        if: ${{ github.event.inputs.format_id == '' }}
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ github.event.inputs.video_url }}"
          echo "🔍 در حال دریافت لیست کیفیت‌ها..."

          if ! yt-dlp -F \
            --impersonate "chrome" \
            --extractor-retries 3 \
            --compat-option manifest-filesize-approx \
            "$URL" > /tmp/formats.txt 2>/tmp/formats.err; then
            echo "❌ Extraction failed:"
            cat /tmp/formats.err
            echo "### ⚠️ Diagnostic Failed" >> $GITHUB_STEP_SUMMARY
            echo "Site likely requires **cookies** or is blocking GitHub IP." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          yt-dlp -J --no-warnings \
            --impersonate "chrome" \
            --extractor-retries 3 \
            "$URL" > /tmp/info.json 2>/dev/null || echo '{}' > /tmp/info.json

          TITLE=$(jq -r '.title // "(unknown)"' /tmp/info.json 2>/dev/null || echo "(unknown)")
          DURATION=$(jq -r '.duration // "?"' /tmp/info.json 2>/dev/null || echo "?")

          echo "## 📋 $TITLE" >> $GITHUB_STEP_SUMMARY
          echo "**مدت:** ${DURATION}s" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Format ID | Ext | Resolution | FPS | VCodec | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-----|------------|-----|--------|------|" >> $GITHUB_STEP_SUMMARY

          awk -F'[|]' '
            /^---/ { in_table=1; next }
            in_table && NF >= 3 {
              split($1, f1, " ")
              if (f1[1] == "" || f1[1] == "ID") next

              format_id  = f1[1]
              ext        = f1[2]
              resolution = f1[3]
              fps        = f1[4]; if (fps == "") fps = "-"

              split($2, f2, " ")
              filesize = "?"
              for (i = 1; i in f2; i++) {
                if (f2[i] ~ /MiB|GiB|KiB/) {
                  filesize = f2[i]
                  if (i > 1 && f2[i-1] == "≈") filesize = "≈" filesize
                  break
                }
              }

              split($3, f3, " ")
              vcodec_raw = f3[1]
              n = split(vcodec_raw, vc, ".")
              vcodec = vc[1]
              if (vcodec == "" || vcodec == "unknown") vcodec = "-"

              printf "| %s | %s | %s | %s | %s | %s |\n", format_id, ext, resolution, fps, vcodec, filesize
            }
          ' /tmp/formats.txt >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 **قدم بعدی:** شناسه فرمت را کپی کن، فیلد `format_id` را پر کن و دوباره اجرا کن." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>🔍 خروجی خام -F</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/formats.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      # ============================================================
      # دانلود
      # ============================================================
      - name: Download
        if: ${{ github.event.inputs.format_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original
          URL="${{ github.event.inputs.video_url }}"
          FORMAT_ID=$(echo "${{ github.event.inputs.format_id }}" | xargs)
          FORMAT_SPEC="${FORMAT_ID}+ba/${FORMAT_ID}/bv*+ba/b"
          echo "📥 Format spec: $FORMAT_SPEC"

          echo "📥 روش ۱: Chrome impersonation..."
          if yt-dlp --no-playlist \
            --no-write-subs --no-write-auto-subs --no-write-thumbnail \
            --no-part \
            --impersonate "chrome" \
            --retries 5 --fragment-retries 5 --extractor-retries 5 --retry-sleep 2 \
            --merge-output-format mp4 \
            -f "$FORMAT_SPEC" \
            --output "original/%(title).200B.%(ext)s" \
            "$URL"; then
            echo "✅ دانلود با روش ۱ موفق بود."
          else
            echo "⚠️ روش ۱ شکست خورد. تلاش با Safari..."
            yt-dlp --no-playlist \
              --no-write-subs --no-write-auto-subs --no-write-thumbnail \
              --no-part \
              --impersonate "safari" \
              --retries 5 --fragment-retries 5 --extractor-retries 5 --retry-sleep 2 \
              --merge-output-format mp4 \
              -f "$FORMAT_SPEC" \
              --output "original/%(title).200B.%(ext)s" \
              "$URL"
          fi
          ls -lh original/

      # ============================================================
      # فشرده‌سازی (حداکثر فشرده‌سازی ممکن)
      # ============================================================
      - name: Compress (Max Compression)
        if: ${{ github.event.inputs.format_id != '' && github.event.inputs.compress == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          INPUT=$(find original -maxdepth 1 -type f \( -name "*.mp4" -o -name "*.mkv" -o -name "*.webm" \) | head -n 1)
          [ -z "$INPUT" ] && { echo "❌ فایل ورودی پیدا نشد"; exit 1; }
          BASENAME=$(basename "$INPUT"); BASENAME="${BASENAME%.*}"

          VCODEC="${{ github.event.inputs.video_codec }}"
          CRF="${{ github.event.inputs.crf }}"
          PRESET="${{ github.event.inputs.preset }}"
          SVT_PRESET="${{ github.event.inputs.svtav1_preset }}"
          ACODEC="${{ github.event.inputs.audio_codec }}"
          ABITRATE="${{ github.event.inputs.audio_bitrate }}"

          [[ "$CRF" =~ ^[0-9]+$ ]] || { echo "❌ CRF باید عدد صحیح باشد"; exit 1; }

          case "$VCODEC" in
            libx264|libx265) MAX_CRF=51 ;;
            libsvtav1) MAX_CRF=63 ;;
            *) MAX_CRF=51 ;;
          esac

          # ============================================================
          # حالت max_compression (فقط برای AV1)
          # ============================================================
          if [ "$VCODEC" = "libsvtav1" ] && [ "${{ github.event.inputs.max_compression }}" = "true" ]; then
            echo "🔥 حالت حداکثر فشرده‌سازی AV1 — preset=0، CRF=45"
            SVT_PRESET=0
            CRF=45
          fi

          # ============================================================
          # حالت تهاجمی اضافی
          # ============================================================
          if [ "${{ github.event.inputs.aggressive_compression }}" = "true" ]; then
            echo "⚡ حالت تهاجمی: CRF +۶، پریست کندتر، صدا 96k"
            CRF=$((CRF + 6))
            case "$VCODEC" in
              libx264|libx265) PRESET="veryslow" ;;
              libsvtav1)
                if [ "${{ github.event.inputs.max_compression }}" = "true" ]; then
                  SVT_PRESET=0
                else
                  SVT_PRESET=6
                fi
                ;;
            esac
            ABITRATE="96k"
          fi

          if [ "$CRF" -gt "$MAX_CRF" ]; then
            echo "⚠️ CRF=$CRF > max=$MAX_CRF → محدود شد"
            CRF=$MAX_CRF
          fi

          if [ "$ACODEC" = "libopus" ]; then OUT_EXT="mkv"; else OUT_EXT="mp4"; fi
          OUT_FILE="output/${BASENAME}_optimized.${OUT_EXT}"

          # ============================================================
          # گزینه‌های ورودی (فقط قبل از -i)
          # -fflags +genpts             → تولید PTS برای فریم‌های بدون تایم‌استمپ
          # -avoid_negative_ts make_zero → شروع از صفر
          # ============================================================
          INPUT_FIX=(-fflags +genpts -avoid_negative_ts make_zero)

          # ============================================================
          # گزینه‌های ویدیو (خروجی)
          # -fps_mode cfr → جایگزین مدرن -vsync (گزینه‌ی خروجی است)
          # ============================================================
          VPARAMS=(-c:v "$VCODEC")
          case "$VCODEC" in
            libx264|libx265)
              VPARAMS+=(-preset "$PRESET" -crf "$CRF" -pix_fmt yuv420p)
              ;;
            libsvtav1)
              VPARAMS+=(-preset "$SVT_PRESET" -crf "$CRF" -pix_fmt yuv420p10le)
              ;;
          esac
          VPARAMS+=(-fps_mode cfr)

          # ============================================================
          # faststart فقط برای MP4
          # ============================================================
          MOVFLAGS=()
          if [ "$OUT_EXT" = "mp4" ]; then
            MOVFLAGS=(-movflags +faststart)
          fi

          # ============================================================
          # اجرا
          # ============================================================
          echo "🎬 ffmpeg ${INPUT_FIX[*]} -i \"$INPUT\" ${VPARAMS[*]} -c:a $ACODEC -b:a $ABITRATE ${MOVFLAGS[*]} \"$OUT_FILE\""
          echo "⏱️ ممکن است ساعت‌ها طول بکشد (بسته به preset و طول ویدیو)"

          ffmpeg -y -hide_banner -stats \
            -loglevel warning \
            "${INPUT_FIX[@]}" \
            -i "$INPUT" \
            "${VPARAMS[@]}" \
            -c:a "$ACODEC" -b:a "$ABITRATE" \
            -max_muxing_queue_size 9999 \
            "${MOVFLAGS[@]}" \
            "$OUT_FILE"

          # ============================================================
          # مقایسه‌ی حجم نهایی
          # ============================================================
          IN_SIZE=$(stat -c%s "$INPUT"); OUT_SIZE=$(stat -c%s "$OUT_FILE")
          IN_MB=$(awk -v s="$IN_SIZE" 'BEGIN {printf "%.1f", s/1048576}')
          OUT_MB=$(awk -v s="$OUT_SIZE" 'BEGIN {printf "%.1f", s/1048576}')
          SAVE_PCT=$(awk -v i="$IN_SIZE" -v o="$OUT_SIZE" 'BEGIN {printf "%.0f", (1 - o/i) * 100}')
          echo "📊 حجم اصلی: ${IN_MB}MB | حجم فشرده: ${OUT_MB}MB | کاهش: ${SAVE_PCT}%"

          if [ "$OUT_SIZE" -ge "$IN_SIZE" ]; then
            echo "⚠️ فشرده‌سازی حجم را کم نکرد؛ نسخه‌ی اصلی حفظ می‌شود."
            cp "$INPUT" "output/$(basename "$INPUT")"
            rm -f "$OUT_FILE"
          fi
          ls -lh output/

      # ============================================================
      # کپی نسخه‌ی اصلی (اگر فشرده‌سازی غیرفعال باشد)
      # ============================================================
      - name: Copy Original (if not compressing)
        if: ${{ github.event.inputs.format_id != '' && github.event.inputs.compress != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          find original -maxdepth 1 -type f -exec cp {} output/ \;
          ls -lh output/

      # ============================================================
      # بسته‌بندی
      # ============================================================
      - name: Package
        if: ${{ github.event.inputs.format_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          [ -z "$(ls -A output)" ] && { echo "❌ پوشه output خالی است"; exit 1; }

          if [ "${{ github.event.inputs.package_as_7z }}" = "true" ]; then
            command -v 7z &>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full; }
            echo "📦 بسته‌بندی با 7z..."
            7z a -t7z -mx=9 -mfb=273 -ms=on artifact/video.7z output/*
          else
            echo "📁 ارسال مستقیم"
            find output -maxdepth 1 -type f -exec cp {} artifact/ \;
          fi
          ls -lh artifact/

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 فایل نهایی" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh artifact/ >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ============================================================
      # آپلود آرتیفکت
      # ============================================================
      - name: Upload artifact
        if: ${{ github.event.inputs.format_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: artifact/
          retention-days: 7
          if-no-files-found: error
