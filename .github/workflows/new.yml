name: Ultimate Video Downloader (Diagnostic)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینک ویدیو'
        required: true
        type: string
      format_id:
        description: 'شناسه فرمت (خالی = فقط لیست کیفیت‌ها)'
        required: false
        type: string
      compress:
        description: 'فشرده‌سازی با FFmpeg؟'
        required: true
        type: boolean
        default: true
      aggressive_compression:
        description: 'حالت تهاجمی (CRF بالاتر، پریست کندتر)'
        required: true
        type: boolean
        default: false
      video_codec:
        description: 'کدک ویدیو'
        required: true
        type: choice
        default: 'libx264'
        options: [libx264, libx265, libsvtav1]
      crf:
        description: 'CRF (x264/x265=0-51، SVT-AV1=0-63)'
        required: true
        type: number
        default: 23
      preset:
        description: 'پریست (x264/x265)'
        required: false
        type: choice
        default: 'medium'
        options: [ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow]
      svtav1_preset:
        description: 'SVT-AV1 preset (0-13)'
        required: false
        type: number
        default: 8
      audio_codec:
        description: 'کدک صدا'
        required: true
        type: choice
        default: 'aac'
        options: [aac, libopus]
      audio_bitrate:
        description: 'بیتریت صدا'
        required: false
        type: string
        default: '128k'
      package_as_7z:
        description: 'بسته‌بندی با 7z (تأثیر کم روی MP4)'
        required: true
        type: boolean
        default: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ github.event.inputs.video_url }}"
          if [ -z "${URL// }" ]; then echo "❌ video_url خالی است"; exit 1; fi
          if ! [[ "$URL" =~ ^https?:// ]]; then echo "❌ video_url باید با http(s):// شروع شود"; exit 1; fi
          if [ "${{ github.event.inputs.aggressive_compression }}" = "true" ] && \
             [ "${{ github.event.inputs.compress }}" != "true" ]; then
            echo "⚠️ aggressive_compression=true ولی compress=false → حالت تهاجمی نادیده گرفته می‌شود."
          fi

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp with compatible curl_cffi
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp
          pip install "curl_cffi>=0.10,<0.16"
          yt-dlp --version

      - name: Verify FFmpeg codecs
        shell: bash
        run: |
          set -euo pipefail
          for codec in libx264 libx265 libsvtav1 libopus aac; do
            if ffmpeg -hide_banner -encoders 2>/dev/null | grep -q " $codec "; then
              echo "✅ $codec"
            else
              echo "❌ $codec NOT available"
            fi
          done

      - name: Install aria2
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2
          aria2c --version | head -n 1

      - name: List Formats (parse -F output)
        if: ${{ github.event.inputs.format_id == '' }}
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ github.event.inputs.video_url }}"
          echo "🔍 Fetching format table via -F..."

          # گرفتن جدول کامل فرمت‌ها با حجم تخمینی
          if ! yt-dlp -F \
            --impersonate "chrome" \
            --extractor-retries 3 \
            --compat-option manifest-filesize-approx \
            "$URL" > /tmp/formats.txt 2>/tmp/formats.err; then
            echo "❌ Extraction failed:"
            cat /tmp/formats.err
            echo "### ⚠️ Diagnostic Failed" >> $GITHUB_STEP_SUMMARY
            echo "Site likely requires **cookies** or is blocking GitHub IP." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # گرفتن عنوان و مدت با -J (سریع، بدون دانلود)
          yt-dlp -J --no-warnings \
            --impersonate "chrome" \
            --extractor-retries 3 \
            "$URL" > /tmp/info.json 2>/dev/null || echo '{}' > /tmp/info.json

          TITLE=$(jq -r '.title // "(unknown)"' /tmp/info.json 2>/dev/null || echo "(unknown)")
          DURATION=$(jq -r '.duration // "?"' /tmp/info.json 2>/dev/null || echo "?")

          echo "## 📋 $TITLE" >> $GITHUB_STEP_SUMMARY
          echo "**مدت:** ${DURATION}s" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Format ID | Ext | Resolution | FPS | VCodec | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-----|------------|-----|--------|------|" >> $GITHUB_STEP_SUMMARY

          # پارس جدول -F با awk (پایدار و مقاوم به تغییرات جزئی)
          awk -F'[|]' '
            /^---/ { in_table=1; next }
            in_table && NF >= 3 {
              split($1, f1, " ")
              if (f1[1] == "" || f1[1] == "ID") next

              format_id  = f1[1]
              ext        = f1[2]
              resolution = f1[3]
              fps        = f1[4]; if (fps == "") fps = "-"

              split($2, f2, " ")
              filesize = "?"
              for (i = 1; i in f2; i++) {
                if (f2[i] ~ /MiB|GiB|KiB/) {
                  filesize = f2[i]
                  if (i > 1 && f2[i-1] == "≈") filesize = "≈" filesize
                  break
                }
              }

              split($3, f3, " ")
              vcodec_raw = f3[1]
              n = split(vcodec_raw, vc, ".")
              vcodec = vc[1]
              if (vcodec == "" || vcodec == "unknown") vcodec = "-"

              printf "| %s | %s | %s | %s | %s | %s |\n", format_id, ext, resolution, fps, vcodec, filesize
            }
          ' /tmp/formats.txt >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 شناسه فرمت را کپی کنید و ورک‌فلو را دوباره با format_id اجرا کنید." >> $GITHUB_STEP_SUMMARY

          # نمایش خروجی خام -F برای دیباگ (قابل باز و بسته شدن)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>🔍 خروجی خام -F (برای دیباگ)</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/formats.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Download (with fallback)
        if: ${{ github.event.inputs.format_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original
          URL="${{ github.event.inputs.video_url }}"
          FORMAT_ID=$(echo "${{ github.event.inputs.format_id }}" | xargs)
          FORMAT_SPEC="${FORMAT_ID}+ba/${FORMAT_ID}/bv*+ba/b"
          echo "📥 Format spec: $FORMAT_SPEC"

          echo "📥 Method 1: Chrome impersonation..."
          if yt-dlp --no-playlist \
            --no-write-subs --no-write-auto-subs --no-write-thumbnail \
            --no-part \
            --impersonate "chrome" \
            --retries 5 --fragment-retries 5 --extractor-retries 5 --retry-sleep 2 \
            --merge-output-format mp4 \
            -f "$FORMAT_SPEC" \
            --output "original/%(title).200B.%(ext)s" \
            "$URL"; then
            echo "✅ Download succeeded with Method 1."
          else
            echo "⚠️ Method 1 failed. Trying Method 2 (Safari impersonation)..."
            yt-dlp --no-playlist \
              --no-write-subs --no-write-auto-subs --no-write-thumbnail \
              --no-part \
              --impersonate "safari" \
              --retries 5 --fragment-retries 5 --extractor-retries 5 --retry-sleep 2 \
              --merge-output-format mp4 \
              -f "$FORMAT_SPEC" \
              --output "original/%(title).200B.%(ext)s" \
              "$URL"
          fi
          ls -lh original/

      - name: Compress
        if: ${{ github.event.inputs.format_id != '' && github.event.inputs.compress == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          INPUT=$(find original -maxdepth 1 -type f \( -name "*.mp4" -o -name "*.mkv" -o -name "*.webm" \) | head -n 1)
          [ -z "$INPUT" ] && { echo "❌ فایل ورودی پیدا نشد"; exit 1; }
          BASENAME=$(basename "$INPUT"); BASENAME="${BASENAME%.*}"

          VCODEC="${{ github.event.inputs.video_codec }}"
          CRF="${{ github.event.inputs.crf }}"
          PRESET="${{ github.event.inputs.preset }}"
          SVT_PRESET="${{ github.event.inputs.svtav1_preset }}"
          ACODEC="${{ github.event.inputs.audio_codec }}"
          ABITRATE="${{ github.event.inputs.audio_bitrate }}"

          [[ "$CRF" =~ ^[0-9]+$ ]] || { echo "❌ CRF باید عدد صحیح باشد"; exit 1; }

          case "$VCODEC" in
            libx264|libx265) MAX_CRF=51 ;;
            libsvtav1) MAX_CRF=63 ;;
            *) MAX_CRF=51 ;;
          esac

          if [ "${{ github.event.inputs.aggressive_compression }}" = "true" ]; then
            CRF=$((CRF + 6))
            case "$VCODEC" in
              libx264|libx265) PRESET="veryslow" ;;
              libsvtav1) SVT_PRESET=4 ;;
            esac
            ABITRATE="96k"
          fi
          [ "$CRF" -gt "$MAX_CRF" ] && CRF=$MAX_CRF

          if [ "$ACODEC" = "libopus" ]; then OUT_EXT="mkv"; else OUT_EXT="mp4"; fi
          OUT_FILE="output/${BASENAME}_optimized.${OUT_EXT}"

          VPARAMS=(-c:v "$VCODEC")
          case "$VCODEC" in
            libx264|libx265) VPARAMS+=(-preset "$PRESET" -crf "$CRF") ;;
            libsvtav1) VPARAMS+=(-preset "$SVT_PRESET" -crf "$CRF") ;;
          esac

          ffmpeg -y -hide_banner -loglevel warning -i "$INPUT" \
            "${VPARAMS[@]}" -c:a "$ACODEC" -b:a "$ABITRATE" \
            -movflags +faststart "$OUT_FILE"

          IN_SIZE=$(stat -c%s "$INPUT"); OUT_SIZE=$(stat -c%s "$OUT_FILE")
          echo "📊 اصلی: $IN_SIZE | فشرده: $OUT_SIZE"
          if [ "$OUT_SIZE" -ge "$IN_SIZE" ]; then
            cp "$INPUT" "output/$(basename "$INPUT")"
            rm -f "$OUT_FILE"
          fi
          ls -lh output/

      - name: Copy Original (if not compressing)
        if: ${{ github.event.inputs.format_id != '' && github.event.inputs.compress != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          find original -maxdepth 1 -type f -exec cp {} output/ \;
          ls -lh output/

      - name: Package
        if: ${{ github.event.inputs.format_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          [ -z "$(ls -A output)" ] && { echo "❌ پوشه output خالی است"; exit 1; }
          if [ "${{ github.event.inputs.package_as_7z }}" = "true" ]; then
            command -v 7z &>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full; }
            7z a -t7z -mx=9 -mfb=273 -ms=on artifact/video.7z output/*
          else
            find output -maxdepth 1 -type f -exec cp {} artifact/ \;
          fi
          ls -lh artifact/ >> $GITHUB_STEP_SUMMARY

      - name: Upload artifact
        if: ${{ github.event.inputs.format_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: artifact/
          retention-days: 7
          if-no-files-found: error
