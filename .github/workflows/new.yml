name: Ultimate Video Downloader (Diagnostic)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینک ویدیو'
        required: true
        type: string
      format_id:
        description: 'شناسه فرمت (خالی = فقط لیست کیفیت‌ها)'
        required: false
        type: string
      compress:
        description: 'فشرده‌سازی با FFmpeg؟'
        required: true
        type: boolean
        default: true
      video_codec:
        description: 'کدک ویدیو'
        required: true
        type: choice
        default: 'libx264'
        options: [libx264, libx265, libsvtav1]
      crf:
        description: 'CRF (x264/x265=0-51، SVT-AV1=0-63)'
        required: true
        type: number
        default: 23
      preset:
        description: 'پریست (x264/x265)'
        required: false
        type: choice
        default: 'medium'
        options: [ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow]

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Setup Python & yt-dlp with all dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # نصب yt-dlp و curl_cffi سازگار
          pip install --upgrade yt-dlp
          pip install "curl_cffi>=0.10,<0.16"
          # نصب aria2 برای دانلود سریع‌تر (اختیاری)
          sudo apt-get update -qq && sudo apt-get install -y -qq aria2
          
          echo "--- Impersonation Targets ---"
          yt-dlp --list-impersonate-targets

      - name: List Formats (Attempt with impersonation)
        if: ${{ github.event.inputs.format_id == '' }}
        shell: bash
        run: |
          set -euo pipefail
          # تلاش برای دریافت اطلاعات با جعل هویت مرورگر کروم
          echo "🔍 Attempting to fetch video info with Chrome impersonation..."
          if yt-dlp -J --no-playlist \
            --impersonate "chrome" \
            --extractor-retries 3 \
            "${{ github.event.inputs.video_url }}" > info.json 2> err.log; then
            
            echo "✅ Successfully fetched info."
            echo "## 📋 Video Formats" >> $GITHUB_STEP_SUMMARY
            echo "| Format ID | Ext | Resolution | VCodec | Size (MB) |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|-----|------------|--------|-----------|" >> $GITHUB_STEP_SUMMARY
            # اصلاح jq برای جلوگیری از خطای split روی null
            jq -r '.formats[] | select(.vcodec != "none") |
              "| \(.format_id) | \(.ext) | \(.resolution // "-") | \((.vcodec // "" | split(".")[0]) | \((.filesize // .filesize_approx // 0) / 1048576 | floor) |"' info.json >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Failed to fetch info even with impersonation."
            echo "--- Error Log ---"
            cat err.log
            echo "### ⚠️ Diagnostic Failed" >> $GITHUB_STEP_SUMMARY
            echo "Could not retrieve video info. The site likely requires **cookies** or is blocking the GitHub Actions IP." >> $GITHUB_STEP_SUMMARY
            echo "See the error log above for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Download (with fallback methods)
        if: ${{ github.event.inputs.format_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original
          URL="${{ github.event.inputs.video_url }}"
          FORMAT="${{ github.event.inputs.format_id }}"
          
          # روش 1: Impersonation با Chrome
          echo "📥 Method 1: Trying with Chrome impersonation..."
          if yt-dlp --no-playlist \
            --impersonate "chrome" \
            --retries 5 --fragment-retries 5 --extractor-retries 5 \
            --merge-output-format mp4 \
            -f "${FORMAT}+ba/${FORMAT}/bv*+ba/b" \
            --output "original/%(title).200B.%(ext)s" \
            "$URL"; then
            
            echo "✅ Download successful with Method 1."
          else
            echo "⚠️ Method 1 failed. Trying Method 2 (Safari impersonation)..."
            # روش 2: Impersonation با Safari (گاهی برای برخی سایت‌ها بهتر جواب می‌دهد)
            yt-dlp --no-playlist \
              --impersonate "safari" \
              --retries 5 --fragment-retries 5 --extractor-retries 5 \
              --merge-output-format mp4 \
              -f "${FORMAT}+ba/${FORMAT}/bv*+ba/b" \
              --output "original/%(title).200B.%(ext)s" \
              "$URL"
          fi
          
          echo "--- Downloaded Files ---"
          ls -lh original/

      - name: Compress (if requested)
        if: ${{ github.event.inputs.format_id != '' && github.event.inputs.compress == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          INPUT=$(find original -maxdepth 1 -type f \( -name "*.mp4" -o -name "*.mkv" -o -name "*.webm" \) | head -n 1)
          [ -z "$INPUT" ] && { echo "❌ No input file found"; exit 1; }
          BASENAME=$(basename "$INPUT"); BASENAME="${BASENAME%.*}"
          
          VCODEC="${{ github.event.inputs.video_codec }}"
          CRF="${{ github.event.inputs.crf }}"
          PRESET="${{ github.event.inputs.preset }}"
          
          # اعتبارسنجی CRF
          [[ "$CRF" =~ ^[0-9]+$ ]] || { echo "❌ CRF must be an integer"; exit 1; }
          
          # محدود کردن CRF بر اساس کدک
          case "$VCODEC" in libx264|libx265) MAX=51;; libsvtav1) MAX=63;; *) MAX=51;; esac
          [ "$CRF" -gt "$MAX" ] && CRF=$MAX
          
          VPARAMS=(-c:v "$VCODEC")
          case "$VCODEC" in
            libx264|libx265) VPARAMS+=(-preset "$PRESET" -crf "$CRF") ;;
            libsvtav1) VPARAMS+=(-preset 8 -crf "$CRF") ;;
          esac
          
          OUT_FILE="output/${BASENAME}_optimized.mp4"
          ffmpeg -y -hide_banner -loglevel warning -i "$INPUT" \
            "${VPARAMS[@]}" -c:a aac -b:a 128k \
            -movflags +faststart "$OUT_FILE"
          
          IN_SIZE=$(stat -c%s "$INPUT"); OUT_SIZE=$(stat -c%s "$OUT_FILE")
          if [ "$OUT_SIZE" -ge "$IN_SIZE" ]; then
            echo "⚠️ Compression increased size; keeping original."
            cp "$INPUT" "output/$(basename "$INPUT")"
            rm -f "$OUT_FILE"
          fi
          ls -lh output/

      - name: Copy Original (if not compressing)
        if: ${{ github.event.inputs.format_id != '' && github.event.inputs.compress != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          find original -maxdepth 1 -type f -exec cp {} output/ \;

      - name: Upload Artifact
        if: ${{ github.event.inputs.format_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: output/
          retention-days: 7
          if-no-files-found: error
