name: Setup Build Cache (FFmpeg + SVT-AV1 + yt-dlp + aria2)

on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'نسخه FFmpeg (مثلاً 7.1)'
        required: true
        default: '7.1'
      svt_av1_version:
        description: 'نسخه SVT-AV1 (مثلاً 3.0.2)'
        required: true
        default: '3.0.2'
      use_prebuilt_ffmpeg:
        description: 'استفاده از باینری آماده (سریع‌تر) به جای بیلد از سورس'
        required: true
        type: boolean
        default: true # پیشنهاد می‌شود برای سرعت بیشتر

jobs:
  cache-ffmpeg:
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # کاهش تایم‌اوت برای جلوگیری از انتظار طولانی
    steps:
      - name: Restore FFmpeg from cache
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ./ffmpeg-static
          key: ffmpeg-${{ inputs.ffmpeg_version }}-svtav1-${{ inputs.svt_av1_version }}-${{ inputs.use_prebuilt_ffmpeg }}-${{ runner.os }}

      # --- مسیر ۱: استفاده از باینری آماده (اگر کش نبود و گزینه فعال باشد) ---
      - name: Download prebuilt FFmpeg with SVT-AV1
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true' && inputs.use_prebuilt_ffmpeg == true
        run: |
          mkdir -p ffmpeg-static/bin
          # دانلود از ریلیزهای پروژه nekotrix (باینری استاتیک لینوکس)
          # توجه: لینک را می‌توانی با آخرین نسخه جایگزین کنی
          wget -q https://github.com/nekotrix/FFmpeg-Builds-SVT-AV1-Essential/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -O ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz -C ffmpeg-static --strip-components=1
          echo "✅ Prebuilt FFmpeg downloaded."

      # --- مسیر ۲: بیلد از سورس (فقط اگر کش نبود و گزینه prebuilt غیرفعال باشد) ---
      - name: Install build dependencies (with DNS/mirror fix)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true' && inputs.use_prebuilt_ffmpeg != true
        run: |
          # اعمال اصلاحات DNS و apt که در بالا توضیح داده شد
          sudo sh -c 'echo "nameserver 8.8.8.8" > /etc/resolv.conf'
          sudo sh -c 'echo "nameserver 8.8.4.4" >> /etc/resolv.conf'
          sudo sed -i -e 's/azure\.//' /etc/apt/apt-mirrors.txt
          echo 'Acquire::Retries "0";' | sudo tee /etc/apt/apt.conf.d/99-custom-retries
          echo 'Acquire::http::Timeout "20";' | sudo tee -a /etc/apt/apt.conf.d/99-custom-retries
          echo 'Acquire::https::Timeout "20";' | sudo tee -a /etc/apt/apt.conf.d/99-custom-retries

          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            autoconf automake build-essential cmake git-core libass-dev \
            libfreetype6-dev libsdl2-dev libtool libva-dev libvdpau-dev \
            libvorbis-dev libxcb1-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            pkg-config texinfo wget zlib1g-dev nasm yasm

      - name: Build SVT-AV1
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true' && inputs.use_prebuilt_ffmpeg != true
        run: |
          set -euo pipefail
          git clone --depth=1 --branch v${{ inputs.svt_av1_version }} https://github.com/OpenVisualCloud/SVT-AV1.git
          cd SVT-AV1 && mkdir -p Build && cd Build
          cmake .. -G"Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          make -j$(nproc) && sudo make install

      - name: Build FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true' && inputs.use_prebuilt_ffmpeg != true
        run: |
          set -euo pipefail
          git clone --depth=1 --branch n${{ inputs.ffmpeg_version }} https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          cd ffmpeg-src
          export LD_LIBRARY_PATH="/usr/local/lib:${LD_LIBRARY_PATH:-}"
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          ./configure --prefix=/usr/local --enable-gpl --enable-libsvtav1 \
            --enable-libx264 --enable-libx265 --enable-libopus \
            --enable-static --disable-shared --disable-doc
          make -j$(nproc) && make install
          mkdir -p $GITHUB_WORKSPACE/ffmpeg-static/bin
          cp /usr/local/bin/ffmpeg /usr/local/bin/ffprobe $GITHUB_WORKSPACE/ffmpeg-static/bin/

  cache-pip-aria2:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # ... (بخش کش پکیج‌های پایتون و aria2 بدون تغییر باقی می‌ماند)
