name: Setup Build Cache (FFmpeg + SVT-AV1 + yt-dlp + aria2)

on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'نسخه FFmpeg (مثلاً 7.1)'
        required: true
        default: '7.1'
        type: string
      svt_av1_version:
        description: 'نسخه SVT-AV1 (مثلاً 3.0.2)'
        required: true
        default: '3.0.2'
        type: string
      use_prebuilt_ffmpeg:
        description: 'استفاده از باینری آماده (سریع‌تر) به جای بیلد از سورس'
        required: true
        type: boolean
        default: true
      yt_dlp_version:
        description: 'نسخه yt-dlp (مثلاً 2026.10.26)'
        required: true
        default: '2026.10.26'
        type: string
      curl_cffi_version:
        description: 'نسخه curl_cffi (مثلاً 0.15.0)'
        required: true
        default: '0.15.0'
        type: string

jobs:
  # ============================================================
  # Job 1: FFmpeg (prebuilt یا build from source) + Cache
  # ============================================================
  cache-ffmpeg:
    name: Cache FFmpeg
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Restore FFmpeg from cache
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ./ffmpeg-static
          key: ffmpeg-${{ inputs.ffmpeg_version }}-svtav1-${{ inputs.svt_av1_version }}-prebuilt-${{ inputs.use_prebuilt_ffmpeg }}-${{ runner.os }}

      # ---------- مسیر ۱: باینری آماده ----------
      - name: Download prebuilt FFmpeg with SVT-AV1
        if: ${{ steps.cache-ffmpeg.outputs.cache-hit != 'true' && fromJSON(inputs.use_prebuilt_ffmpeg) == true }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ffmpeg-static/bin
          echo "📥 Downloading prebuilt FFmpeg with SVT-AV1..."
          wget -q --show-progress \
            "https://github.com/nekotrix/FFmpeg-Builds-SVT-AV1-Essential/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" \
            -O /tmp/ffmpeg.tar.xz
          tar -xf /tmp/ffmpeg.tar.xz -C ffmpeg-static --strip-components=1
          chmod +x ffmpeg-static/bin/ffmpeg ffmpeg-static/bin/ffprobe || true
          echo "✅ Prebuilt FFmpeg extracted."
          ./ffmpeg-static/bin/ffmpeg -version | head -n 1

      # ---------- مسیر ۲: بیلد از سورس ----------
      - name: Install build dependencies
        if: ${{ steps.cache-ffmpeg.outputs.cache-hit != 'true' && fromJSON(inputs.use_prebuilt_ffmpeg) != true }}
        shell: bash
        run: |
          set -euo pipefail
          # اصلاح DNS برای جلوگیری از خطای Temporary failure resolving
          sudo sh -c 'echo "nameserver 8.8.8.8" > /etc/resolv.conf'
          sudo sh -c 'echo "nameserver 8.8.4.4" >> /etc/resolv.conf'
          # حذف پیشوند azure از میرور برای failover سریع‌تر
          sudo sed -i -e 's/azure\.//' /etc/apt/apt-mirrors.txt || true
          # تایم‌اوت کوتاه و بدون retry تا سریع به میرور بعدی بره
          echo 'Acquire::Retries "1";' | sudo tee /etc/apt/apt.conf.d/99-custom-retries
          echo 'Acquire::http::Timeout "20";' | sudo tee -a /etc/apt/apt.conf.d/99-custom-retries
          echo 'Acquire::https::Timeout "20";' | sudo tee -a /etc/apt/apt.conf.d/99-custom-retries

          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            autoconf automake build-essential cmake git-core libass-dev \
            libfreetype6-dev libsdl2-dev libtool libva-dev libvdpau-dev \
            libvorbis-dev libxcb1-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            pkg-config texinfo wget zlib1g-dev nasm yasm

      - name: Build SVT-AV1
        if: ${{ steps.cache-ffmpeg.outputs.cache-hit != 'true' && fromJSON(inputs.use_prebuilt_ffmpeg) != true }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "v${{ inputs.svt_av1_version }}" \
            https://github.com/OpenVisualCloud/SVT-AV1.git
          cd SVT-AV1
          mkdir -p Build && cd Build
          cmake .. -G"Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          make -j"$(nproc)"
          sudo make install
          echo "✅ SVT-AV1 v${{ inputs.svt_av1_version }} built and installed."

      - name: Build FFmpeg
        if: ${{ steps.cache-ffmpeg.outputs.cache-hit != 'true' && fromJSON(inputs.use_prebuilt_ffmpeg) != true }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "n${{ inputs.ffmpeg_version }}" \
            https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          cd ffmpeg-src
          export LD_LIBRARY_PATH="/usr/local/lib:${LD_LIBRARY_PATH:-}"
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          ./configure \
            --prefix=/usr/local \
            --enable-gpl \
            --enable-libsvtav1 \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libopus \
            --enable-static \
            --disable-shared \
            --disable-doc
          make -j"$(nproc)"
          make install
          mkdir -p "${{ github.workspace }}/ffmpeg-static/bin"
          cp /usr/local/bin/ffmpeg /usr/local/bin/ffprobe "${{ github.workspace }}/ffmpeg-static/bin/"
          echo "✅ FFmpeg n${{ inputs.ffmpeg_version }} built and packaged."

      - name: Verify FFmpeg binary
        shell: bash
        run: |
          set -euo pipefail
          "${{ github.workspace }}/ffmpeg-static/bin/ffmpeg" -version | head -n 1
          if "${{ github.workspace }}/ffmpeg-static/bin/ffmpeg" -hide_banner -encoders 2>/dev/null | grep -q "libsvtav1"; then
            echo "✅ libsvtav1 is available in the cached FFmpeg."
          else
            echo "❌ libsvtav1 NOT available in the cached FFmpeg."
            exit 1
          fi

  # ============================================================
  # Job 2: yt-dlp + curl_cffi + aria2 + Cache
  # ============================================================
  cache-pip-aria2:
    name: Cache pip & aria2
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ inputs.yt_dlp_version }}-curl-cffi-${{ inputs.curl_cffi_version }}-${{ runner.os }}

      - name: Restore Python site-packages
        id: cache-pysite
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/lib/python3.12/site-packages
            ~/.local/bin
          key: pysite-${{ inputs.yt_dlp_version }}-${{ inputs.curl_cffi_version }}-${{ runner.os }}

      - name: Install yt-dlp and curl_cffi
        if: ${{ steps.cache-pysite.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --user --no-cache-dir \
            "yt-dlp==${{ inputs.yt_dlp_version }}" \
            "curl_cffi==${{ inputs.curl_cffi_version }}"
          echo "✅ yt-dlp version: $(~/.local/bin/yt-dlp --version || yt-dlp --version)"

      - name: Verify Python packages
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          yt-dlp --version
          python -c "import curl_cffi; print('curl_cffi:', curl_cffi.__version__)"

      - name: Restore aria2 binary cache
        id: cache-aria2
        uses: actions/cache@v4
        with:
          path: /tmp/aria2-bin
          key: aria2-${{ runner.os }}-v1.37.0

      - name: Install aria2 (if not cached)
        if: ${{ steps.cache-aria2.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo sh -c 'echo "nameserver 8.8.8.8" > /etc/resolv.conf'
          sudo sh -c 'echo "nameserver 8.8.4.4" >> /etc/resolv.conf'
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2
          mkdir -p /tmp/aria2-bin
          cp /usr/bin/aria2c /tmp/aria2-bin/
          echo "✅ aria2 installed and copied to cache path."

      - name: Verify aria2
        shell: bash
        run: |
          if [ -f /tmp/aria2-bin/aria2c ]; then
            /tmp/aria2-bin/aria2c --version | head -n 1
          else
            aria2c --version | head -n 1
          fi
